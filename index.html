<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Kutu - 100 Puan Hedefi 🏆</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            touch-action: none;
        }
        body {
            background: #222;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 360px;
            height: 540px;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            background: linear-gradient(to bottom, #70c5ce 0%, #ffffff 100%); 
        }
        canvas {
            display: block;
        }
        .ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            pointer-events: none;
            z-index: 10;
        }
        #restartBtn {
            display: none;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffcc00;
            color: #000;
            border: 4px solid #000;
            padding: 12px 24px;
            font-size: 1.3rem;
            font-family: inherit;
            cursor: pointer;
            z-index: 20;
            box-shadow: 5px 5px 0 #000;
        }
        #restartBtn:active {
            box-shadow: 2px 2px 0 #000;
            transform: translate(-48%, -48%);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui" id="scoreBoard">0</div>
        <button id="restartBtn" onclick="resetGame()">Yeniden Başla</button>
        <canvas id="gameCanvas" width="360" height="540"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreBoard = document.getElementById("scoreBoard");
        const restartBtn = document.getElementById("restartBtn");

        let frames = 0;
        let score = 0;
        let state = 'getReady'; // getReady, playing, gameOver, victory

        const gravity = 0.25;
        const jumpStrength = -4.6;
        const pipeSpeed = 2;

        const bird = {
            x: 50,
            y: canvas.height / 2 - 15,
            width: 30,
            height: 30,
            gravity: gravity,
            velocity: 0,
            jump: jumpStrength,
            rotation: 0,
            color: "#FFD700",
            strokeColor: "#DAA520"
        };

        let pipes = [];
        let particles = []; // Zafer animasyonu için konfetiler

        function flap(e) {
            if (state === 'getReady') {
                state = 'playing';
                bird.velocity = bird.jump;
            } else if (state === 'playing') {
                bird.velocity = bird.jump;
            }
        }

        canvas.addEventListener("mousedown", flap);
        canvas.addEventListener("touchstart", flap, { passive: true });

        function createPipe() {
            const gap = 140;
            const pipeWidth = 60;
            const minPipeHeight = 50;
            const maxPipeHeight = canvas.height - gap - minPipeHeight;
            const topHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + gap,
                width: pipeWidth,
                scored: false
            });
        }

        // Zafer konfetilerini başlat
        function triggerVictory() {
            state = 'victory';
            restartBtn.style.display = 'block';
            
            // Renkli konfetiler üret
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 2,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 6 + 4
                });
            }
        }

        function update() {
            if (state === 'gameOver') return;

            // Eğer zafer durumundaysak sadece konfetileri güncelle
            if (state === 'victory') {
                for (let p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2; // Yerçekimi efekti
                }
                return;
            }

            frames++;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocity * 0.1));

            if (bird.y + bird.height >= canvas.height) {
                state = 'gameOver';
                restartBtn.style.display = 'block';
            }

            if (bird.y <= 0) {
                bird.y = 0;
                bird.velocity = 0;
            }

            if (state === 'playing' && frames % 100 === 0) {
                createPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= pipeSpeed;

                let birdBox = { x: bird.x, y: bird.y, w: bird.width, h: bird.height };
                let topPipeBox = { x: p.x, y: 0, w: p.width, h: p.topHeight };
                let bottomPipeBox = { x: p.x, y: p.bottomY, w: p.width, h: canvas.height - p.bottomY };

                if (boxIntersect(birdBox, topPipeBox) || boxIntersect(birdBox, bottomPipeBox)) {
                    state = 'gameOver';
                    restartBtn.style.display = 'block';
                    break;
                }

                if (!p.scored && bird.x > p.x + p.width) {
                    score++;
                    scoreBoard.textContent = score;
                    p.scored = true;

                    // 100 PUAN KONTROLÜ 🏆
                    if (score >= 100) {
                        triggerVictory();
                        break;
                    }
                }

                if (p.x + p.width < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function boxIntersect(a, b) {
            return a.x < b.x + b.w &&
                   a.x + a.w > b.x &&
                   a.y < b.y + b.h &&
                   a.y + a.h > b.y;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Borular
            for (let p of pipes) {
                ctx.fillStyle = "#2ecc71";
                ctx.strokeStyle = "#27ae60";
                ctx.lineWidth = 2;

                ctx.fillRect(p.x, 0, p.width, p.topHeight);
                ctx.strokeRect(p.x, 0, p.width, p.topHeight);
                ctx.fillRect(p.x - 5, p.topHeight - 20, p.width + 10, 20);
                ctx.strokeRect(p.x - 5, p.topHeight - 20, p.width + 10, 20);

                ctx.fillRect(p.x, p.bottomY, p.width, canvas.height - p.bottomY);
                ctx.strokeRect(p.x, p.bottomY, p.width, canvas.height - p.bottomY);
                ctx.fillRect(p.x - 5, p.bottomY, p.width + 10, 20);
                ctx.strokeRect(p.x - 5, p.bottomY, p.width + 10, 20);
            }

            // Kuş
            ctx.save();
            ctx.translate(bird.x + bird.width/2, bird.y + bird.height/2);
            ctx.rotate(bird.rotation);
            
            ctx.fillStyle = bird.color;
            ctx.fillRect(-bird.width/2, -bird.height/2, bird.width, bird.height);
            ctx.strokeStyle = bird.strokeColor;
            ctx.lineWidth = 3;
            ctx.strokeRect(-bird.width/2, -bird.height/2, bird.width, bird.height);
            
            ctx.fillStyle = "#fff";
            ctx.fillRect(5 - bird.width/2, 8 - bird.height/2, 6, 6);
            ctx.fillStyle = "#000";
            ctx.fillRect(7 - bird.width/2, 10 - bird.height/2, 2, 2);

            ctx.restore();

            // Başlangıç Yazısı
            if (state === 'getReady') {
                ctx.fillStyle = "white";
                ctx.font = "24px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("HEDEF: 100 PUAN", canvas.width / 2, canvas.height / 2 - 30);
                ctx.font = "14px 'Courier New'";
                ctx.fillText("Başlamak için ekrana dokun", canvas.width / 2, canvas.height / 2 + 10);
            }

            // Zafer Animasyonu (Konfetiler ve Tebrikler)
            if (state === 'victory') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Konfetileri Çiz
                for (let p of particles) {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }

                ctx.fillStyle = "#FFD700";
                ctx.font = "bold 32px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("TEBRİKLER!", canvas.width / 2, canvas.height / 2 - 50);
                
                ctx.fillStyle = "#fff";
                ctx.font = "18px 'Courier New'";
                ctx.fillText("100 Puana Ulaştın! 🏆", canvas.width / 2, canvas.height / 2 - 10);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function resetGame() {
            state = 'getReady';
            bird.y = canvas.height / 2 - 15;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            particles = [];
            score = 0;
            scoreBoard.textContent = score;
            restartBtn.style.display = 'none';
            frames = 0;
        }

        loop();
    </script>
</body>
</html>
